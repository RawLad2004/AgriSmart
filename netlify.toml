# Netlify configuration: security headers.
# NOTE: 'unsafe-inline' remains for scripts/styles for now because several pages use
# inline onclick handlers, inline <script> blocks and inline style="" attributes.
# Output escaping (js/security.js) is the primary XSS defence; the plan is to remove
# 'unsafe-inline' for scripts once those handlers are moved into .js files (Phase 1).

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = """\
      default-src 'self'; \
      script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; \
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; \
      font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; \
      img-src 'self' data: blob: https://*.supabase.co https://openweathermap.org; \
      connect-src 'self' https://*.supabase.co https://api.openweathermap.org; \
      object-src 'none'; \
      base-uri 'self'; \
      form-action 'self'; \
      frame-ancestors 'none'"""
