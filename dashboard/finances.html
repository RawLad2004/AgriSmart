<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finances | AgriSmart</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">

</head>
<body>

<div class="app-shell">

    <aside class="sidebar">

        <div class="logo">
            <div class="as-logo">
                <span class="letter-a">A</span>
                <span class="letter-s">S</span>
            </div>
            <h2>AgriSmart</h2>
        </div>

        <a href="dashboard.html" class="sidebar-link">
            <i class="fa-solid fa-house"></i> Overview
        </a>
        <a href="farms.html" class="sidebar-link">
            <i class="fa-solid fa-tractor"></i> My Farms
        </a>
        <a href="crops.html" class="sidebar-link">
            <i class="fa-solid fa-wheat-awn"></i> Crops
        </a>
        <a href="livestock.html" class="sidebar-link">
            <i class="fa-solid fa-cow"></i> Livestock
        </a>
        <a href="weather.html" class="sidebar-link">
            <i class="fa-solid fa-cloud-sun-rain"></i> Weather
        </a>
        <a href="market.html" class="sidebar-link">
            <i class="fa-solid fa-chart-line"></i> Market
        </a>
        <a href="finances.html" class="sidebar-link active">
            <i class="fa-solid fa-wallet"></i> Finances
        </a>
        <a href="articles.html" class="sidebar-link">
            <i class="fa-solid fa-book"></i> Knowledge Hub
        </a>

        <div class="sidebar-bottom">
            <a href="#" id="logout-btn" class="sidebar-link">
                <i class="fa-solid fa-right-from-bracket"></i> Log Out
            </a>
        </div>

    </aside>

    <div class="main-area">

        <div class="topbar">
            <h1>Finances</h1>
            <div class="topbar-user">
                <div class="notif-bell" id="notif-bell">
                    <i class="fa-solid fa-bell"></i>
                    <span class="notif-badge" id="notif-badge">0</span>
                    <div class="notif-dropdown" id="notif-dropdown" onclick="event.stopPropagation()">
                        <div class="notif-dropdown-header">
                            <span>Notifications</span>
                            <button type="button" id="mark-all-read">Mark all read</button>
                        </div>
                        <div id="notif-list"></div>
                    </div>
                </div>
                <span id="user-name">Loading…</span>
                <div class="avatar" id="user-avatar">?</div>
            </div>
        </div>

        <div class="dashboard-content">

            <div class="farm-select-bar">
                <select id="farm-select">
                    <option value="">Select a farm…</option>
                </select>
                <button class="primary-btn" id="open-add-txn" style="padding:12px 26px;">
                    <i class="fa-solid fa-plus"></i> Add Transaction
                </button>
            </div>

            <div id="finances-content">
                <div class="empty-state">
                    <i class="fa-solid fa-wallet"></i>
                    <p>Select a farm above to view its finances.</p>
                </div>
            </div>

        </div>

    </div>

</div>

<!--=====================================
        ADD TRANSACTION MODAL
======================================-->
<div class="modal-overlay" id="add-txn-modal">
    <div class="modal-box">
        <h3>Add a Transaction</h3>
        <form id="add-txn-form">

            <div class="form-group">
                <label for="txn_type">Type</label>
                <select id="txn_type">
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>
            </div>

            <div class="form-group">
                <label for="txn_category">Category</label>
                <input type="text" id="txn_category" required placeholder="e.g. Seed, Produce Sale, Labor">
            </div>

            <div class="form-group">
                <label for="txn_amount">Amount (KES)</label>
                <input type="number" id="txn_amount" step="0.01" required placeholder="e.g. 3500">
            </div>

            <div class="form-group">
                <label for="txn_date">Date</label>
                <input type="date" id="txn_date" required>
            </div>

            <div class="form-group">
                <label for="txn_note">Note (optional)</label>
                <textarea id="txn_note" rows="2" placeholder="Any extra detail"></textarea>
            </div>

            <div id="txn-form-error" class="form-error"></div>

            <div class="modal-actions">
                <button type="button" class="secondary-btn" id="cancel-add-txn" style="padding:12px 26px;">Cancel</button>
                <button type="submit" class="primary-btn" style="padding:12px 26px;">Save</button>
            </div>

        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/table-scroll.js"></script>
<script src="../js/finances.js"></script>

</body>
</html>
