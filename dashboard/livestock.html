<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livestock | AgriSmart</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">

</head>
<body>

<div class="app-shell">

    <aside class="sidebar">

        <div class="logo">
            <div class="as-logo">
                <span class="letter-a">A</span>
                <span class="letter-s">S</span>
            </div>
            <h2>AgriSmart</h2>
        </div>

        <a href="dashboard.html" class="sidebar-link">
            <i class="fa-solid fa-house"></i> Overview
        </a>
        <a href="farms.html" class="sidebar-link">
            <i class="fa-solid fa-tractor"></i> My Farms
        </a>
        <a href="crops.html" class="sidebar-link">
            <i class="fa-solid fa-wheat-awn"></i> Crops
        </a>
        <a href="livestock.html" class="sidebar-link active">
            <i class="fa-solid fa-cow"></i> Livestock
        </a>
        <a href="weather.html" class="sidebar-link">
            <i class="fa-solid fa-cloud-sun-rain"></i> Weather
        </a>
        <a href="market.html" class="sidebar-link">
            <i class="fa-solid fa-chart-line"></i> Market
        </a>
        <a href="finances.html" class="sidebar-link">
            <i class="fa-solid fa-wallet"></i> Finances
        </a>
        <a href="articles.html" class="sidebar-link">
            <i class="fa-solid fa-book"></i> Knowledge Hub
        </a>
        <a href="admin.html" class="sidebar-link" id="admin-sidebar-link" style="display:none;">
            <i class="fa-solid fa-shield-halved"></i> Admin
        </a>

        <div class="sidebar-bottom">
            <a href="profile.html" class="sidebar-link">
                <i class="fa-solid fa-user-gear"></i> Profile
            </a>
            <a href="#" id="logout-btn" class="sidebar-link">
                <i class="fa-solid fa-right-from-bracket"></i> Log Out
            </a>
        </div>

    </aside>

    <div class="main-area">

        <div class="topbar">
            <h1>Livestock</h1>
            <div class="topbar-user">
                <div class="notif-bell" id="notif-bell">
                    <i class="fa-solid fa-bell"></i>
                    <span class="notif-badge" id="notif-badge">0</span>
                    <div class="notif-dropdown" id="notif-dropdown" onclick="event.stopPropagation()">
                        <div class="notif-dropdown-header">
                            <span>Notifications</span>
                            <button type="button" id="mark-all-read">Mark all read</button>
                        </div>
                        <div id="notif-list"></div>
                    </div>
                </div>
                <span id="user-name">Loading…</span>
                <div class="avatar" id="user-avatar">?</div>
            </div>
        </div>

        <div class="dashboard-content">

            <div class="panel">
                <div class="panel-header">
                    <h2>Livestock Enterprises</h2>
                    <button class="primary-btn" id="open-add-enterprise" style="padding:12px 26px;">
                        <i class="fa-solid fa-plus"></i> Add Livestock Enterprise
                    </button>
                </div>
                <div id="enterprises-list">
                    <p style="color:var(--dark-grey);">Loading…</p>
                </div>
            </div>

            <div class="panel" id="animals-panel" style="display:none;">
                <div class="panel-header">
                    <h2 id="animals-panel-title">Animals</h2>
                    <button class="primary-btn" id="open-add-animal" style="padding:12px 26px;">
                        <i class="fa-solid fa-plus"></i> Add Animal
                    </button>
                </div>
                <div id="animals-list"></div>
            </div>

        </div>

    </div>

</div>

<!--=====================================
    ADD LIVESTOCK ENTERPRISE MODAL
======================================-->
<div class="modal-overlay" id="add-enterprise-modal">
    <div class="modal-box">
        <h3>Add a Livestock Enterprise</h3>
        <form id="add-enterprise-form">

            <div class="form-group">
                <label for="ent_farm">Farm</label>
                <select id="ent_farm" required>
                    <option value="">Select a farm…</option>
                </select>
            </div>

            <div class="form-group">
                <label for="ent_name">Enterprise name</label>
                <input type="text" id="ent_name" required placeholder="e.g. Dairy Herd">
            </div>

            <div class="form-group">
                <label for="ent_type">Enterprise type</label>
                <select id="ent_type">
                    <option value="livestock">Livestock (general)</option>
                    <option value="dairy">Dairy</option>
                    <option value="poultry">Poultry</option>
                    <option value="aquaculture">Aquaculture</option>
                    <option value="apiary">Apiary</option>
                </select>
            </div>

            <div id="enterprise-form-error" class="form-error"></div>

            <div class="modal-actions">
                <button type="button" class="secondary-btn" id="cancel-add-enterprise" style="padding:12px 26px;">Cancel</button>
                <button type="submit" class="primary-btn" style="padding:12px 26px;">Save</button>
            </div>

        </form>
    </div>
</div>

<!--=====================================
            ADD ANIMAL MODAL
======================================-->
<div class="modal-overlay" id="add-animal-modal">
    <div class="modal-box">
        <h3>Add an Animal</h3>
        <form id="add-animal-form">

            <div class="form-group">
                <label for="animal_species">Species</label>
                <div style="display:flex;gap:10px;">
                    <input type="text" id="animal_species" required placeholder="e.g. Dairy Cow, Broiler Chicken" style="flex:1;min-width:0;">
                    <button type="button" class="secondary-btn" id="open-species-picker" style="padding:0 18px;white-space:nowrap;">
                        <i class="fa-solid fa-list"></i> Browse
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="animal_breed">Breed</label>
                <input type="text" id="animal_breed" placeholder="e.g. Friesian">
            </div>

            <div class="form-group">
                <label for="animal_tag">Tag ID</label>
                <input type="text" id="animal_tag" placeholder="e.g. COW-014">
            </div>

            <div class="form-group">
                <label for="animal_dob">Date of birth</label>
                <input type="date" id="animal_dob">
            </div>

            <div class="form-group">
                <label for="animal_status">Status</label>
                <select id="animal_status">
                    <option value="active">Active</option>
                    <option value="sold">Sold</option>
                    <option value="deceased">Deceased</option>
                </select>
            </div>

            <div id="animal-form-error" class="form-error"></div>

            <div class="modal-actions">
                <button type="button" class="secondary-btn" id="cancel-add-animal" style="padding:12px 26px;">Cancel</button>
                <button type="submit" class="primary-btn" style="padding:12px 26px;">Save</button>
            </div>

        </form>
    </div>
</div>

<!--=====================================
            SPECIES PICKER MODAL
======================================-->
<div class="modal-overlay" id="species-picker-modal" role="dialog" aria-modal="true" aria-labelledby="species-picker-title">
    <div class="modal-box" style="max-width:620px;max-height:80vh;overflow-y:auto;">
        <h3 id="species-picker-title">Browse Species</h3>
        <div id="species-picker-list"></div>
        <div class="modal-actions">
            <button type="button" class="secondary-btn" id="close-species-picker" style="padding:12px 26px;">
                Close (use custom species)
            </button>
        </div>
    </div>
</div>

<!--=====================================
        ANIMAL RECORDS MODAL
    Feed / Vaccinations / Health / Growth
======================================-->
<div class="modal-overlay" id="animal-records-modal" role="dialog" aria-modal="true" aria-labelledby="animal-records-title">
    <div class="modal-box" style="max-width:800px;max-height:85vh;overflow-y:auto;">

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
            <h3 id="animal-records-title" style="margin-bottom:0;">Records</h3>
            <button type="button" class="secondary-btn" id="close-animal-records" aria-label="Close records" style="padding:8px 16px;">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="farm-select-bar" style="margin-bottom:20px;">
            <button type="button" class="secondary-btn record-tab-btn active" data-record-tab="feed" style="padding:10px 20px;">
                <i class="fa-solid fa-wheat-awn"></i> Feed
            </button>
            <button type="button" class="secondary-btn record-tab-btn" data-record-tab="vaccinations" style="padding:10px 20px;">
                <i class="fa-solid fa-syringe"></i> Vaccinations
            </button>
            <button type="button" class="secondary-btn record-tab-btn" data-record-tab="health" style="padding:10px 20px;">
                <i class="fa-solid fa-notes-medical"></i> Health
            </button>
            <button type="button" class="secondary-btn record-tab-btn" data-record-tab="growth" style="padding:10px 20px;">
                <i class="fa-solid fa-weight-scale"></i> Growth
            </button>
        </div>

        <!-- ---- FEED TAB ---- -->
        <div id="record-tab-feed">
            <button type="button" class="primary-btn" id="open-add-feed-log" style="padding:10px 22px;margin-bottom:15px;">
                <i class="fa-solid fa-plus"></i> Log Feeding
            </button>
            <div id="add-feed-log-panel" class="panel" style="display:none;margin-bottom:20px;">
                <form id="add-feed-log-form">
                    <div class="form-group">
                        <label for="feed_type">Feed type</label>
                        <input type="text" id="feed_type" required placeholder="e.g. Dairy meal, Napier grass">
                    </div>
                    <div class="form-group">
                        <label for="feed_quantity">Quantity</label>
                        <input type="number" id="feed_quantity" step="0.01" min="0.01" required placeholder="e.g. 5">
                    </div>
                    <div class="form-group">
                        <label for="feed_unit">Unit</label>
                        <select id="feed_unit">
                            <option value="kg">kg</option>
                            <option value="bags">bags</option>
                            <option value="litres">litres</option>
                            <option value="bales">bales</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="feed_date">Date</label>
                        <input type="date" id="feed_date">
                    </div>
                    <div class="form-group">
                        <label for="feed_cost">Cost (optional)</label>
                        <input type="number" id="feed_cost" step="0.01" min="0" placeholder="KES">
                    </div>
                    <div id="feed-log-form-error" class="form-error"></div>
                    <div class="modal-actions">
                        <button type="submit" class="primary-btn" style="padding:10px 22px;">Save</button>
                    </div>
                </form>
            </div>
            <div id="feed-logs-list"></div>
        </div>

        <!-- ---- VACCINATIONS TAB ---- -->
        <div id="record-tab-vaccinations" style="display:none;">
            <button type="button" class="primary-btn" id="open-add-vaccination" style="padding:10px 22px;margin-bottom:15px;">
                <i class="fa-solid fa-plus"></i> Log Vaccination
            </button>
            <div id="add-vaccination-panel" class="panel" style="display:none;margin-bottom:20px;">
                <form id="add-vaccination-form">
                    <div class="form-group">
                        <label for="vaccine_name">Vaccine / treatment name</label>
                        <input type="text" id="vaccine_name" required placeholder="e.g. FMD Vaccine">
                    </div>
                    <div class="form-group">
                        <label for="vaccine_date">Date administered</label>
                        <input type="date" id="vaccine_date">
                    </div>
                    <div class="form-group">
                        <label for="vaccine_next_due">Next due date</label>
                        <input type="date" id="vaccine_next_due">
                    </div>
                    <div class="form-group">
                        <label for="vaccine_dosage">Dosage</label>
                        <input type="text" id="vaccine_dosage" placeholder="e.g. 2ml subcutaneous">
                    </div>
                    <div class="form-group">
                        <label for="vaccine_administered_by">Administered by</label>
                        <input type="text" id="vaccine_administered_by" placeholder="e.g. Dr. Kamau / Self">
                    </div>
                    <div id="vaccination-form-error" class="form-error"></div>
                    <div class="modal-actions">
                        <button type="submit" class="primary-btn" style="padding:10px 22px;">Save</button>
                    </div>
                </form>
            </div>
            <div id="vaccinations-list"></div>
        </div>

        <!-- ---- HEALTH TAB ---- -->
        <div id="record-tab-health" style="display:none;">
            <button type="button" class="primary-btn" id="open-add-health-record" style="padding:10px 22px;margin-bottom:15px;">
                <i class="fa-solid fa-plus"></i> Log Health Record
            </button>
            <div id="add-health-record-panel" class="panel" style="display:none;margin-bottom:20px;">
                <form id="add-health-record-form">
                    <div class="form-group">
                        <label for="health_type">Record type</label>
                        <select id="health_type">
                            <option value="illness">Illness</option>
                            <option value="treatment">Treatment</option>
                            <option value="injury">Injury</option>
                            <option value="checkup">Checkup</option>
                            <option value="deworming">Deworming</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="health_description">Description</label>
                        <textarea id="health_description" rows="2" required placeholder="What happened / was observed"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="health_date">Date</label>
                        <input type="date" id="health_date">
                    </div>
                    <div class="form-group">
                        <label for="health_treatment">Treatment given</label>
                        <input type="text" id="health_treatment" placeholder="e.g. Antibiotic course">
                    </div>
                    <div class="form-group">
                        <label for="health_vet">Vet name</label>
                        <input type="text" id="health_vet" placeholder="e.g. Dr. Kamau">
                    </div>
                    <div class="form-group">
                        <label for="health_cost">Cost (optional)</label>
                        <input type="number" id="health_cost" step="0.01" min="0" placeholder="KES">
                    </div>
                    <div class="form-group">
                        <label for="health_follow_up">Follow-up date (optional)</label>
                        <input type="date" id="health_follow_up">
                    </div>
                    <div id="health-record-form-error" class="form-error"></div>
                    <div class="modal-actions">
                        <button type="submit" class="primary-btn" style="padding:10px 22px;">Save</button>
                    </div>
                </form>
            </div>
            <div id="health-records-list"></div>
        </div>

        <!-- ---- GROWTH TAB ---- -->
        <div id="record-tab-growth" style="display:none;">
            <button type="button" class="primary-btn" id="open-add-growth-record" style="padding:10px 22px;margin-bottom:15px;">
                <i class="fa-solid fa-plus"></i> Log Weight
            </button>
            <div id="add-growth-record-panel" class="panel" style="display:none;margin-bottom:20px;">
                <form id="add-growth-record-form">
                    <div class="form-group">
                        <label for="growth_weight">Weight (kg)</label>
                        <input type="number" id="growth_weight" step="0.01" min="0.01" required placeholder="e.g. 320">
                    </div>
                    <div class="form-group">
                        <label for="growth_date">Date</label>
                        <input type="date" id="growth_date">
                    </div>
                    <div class="form-group">
                        <label for="growth_notes">Notes (optional)</label>
                        <input type="text" id="growth_notes" placeholder="e.g. Post-deworming weigh-in">
                    </div>
                    <div id="growth-record-form-error" class="form-error"></div>
                    <div class="modal-actions">
                        <button type="submit" class="primary-btn" style="padding:10px 22px;">Save</button>
                    </div>
                </form>
            </div>
            <div id="growth-records-list"></div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/security.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/table-scroll.js"></script>
<script src="../js/sidebar-toggle.js"></script>
<script src="../js/sidebar-nav.js"></script>
<script src="../js/species-catalog.js"></script>
<script src="../js/animal-records.js"></script>
<script src="../js/livestock.js"></script>

</body>
</html>
